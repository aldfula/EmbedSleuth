[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedsleuth"
version = "0.1.0"
description = "Evidence-based embedded diagnostics for AI hosts via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "paramiko>=3.4,<5", "mcp>=2.3,<3", "anyio>=4.9,<5"]

[project.scripts]
embedsleuth-mcp = "embedsleuth.mcp_server:main"
embedsleuth-hook = "embedsleuth.hooks:main"
embedsleuth-setup = "embedsleuth.workspace:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]
release = ["build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/aldfula/EmbedSleuth"
Documentation = "https://github.com/aldfula/EmbedSleuth/blob/main/docs/installation.md"
Issues = "https://github.com/aldfula/EmbedSleuth/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
embedsleuth = ["data/profiles/*.json", "data/*.json", "data/skills/*/*.md", "data/skills/*/references/*.md", "data/skills/*/agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
