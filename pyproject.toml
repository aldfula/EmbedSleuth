[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedsleuth"
version = "0.1.0"
description = "Evidence-based embedded diagnostics for AI hosts via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "paramiko>=3.4,<5", "mcp>=2.3,<3", "anyio>=4.9,<5"]

[project.scripts]
embedsleuth-mcp = "embedsleuth.mcp_server:main"
embedsleuth-hook = "embedsleuth.hooks:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embedsleuth = ["data/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
