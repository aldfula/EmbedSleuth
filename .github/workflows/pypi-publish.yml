name: Publish verified v0.1.0 to PyPI

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after validation (requires Trusted Publisher)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-embedsleuth-v0.1.0
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'aldfula/EmbedSleuth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the existing public GitHub release
        env:
          RELEASE_URL: https://github.com/aldfula/EmbedSleuth/releases/download/v0.1.0
        run: |
          mkdir release-files
          curl --fail --location --silent --show-error "$RELEASE_URL/embedsleuth-0.1.0-py3-none-any.whl" --output release-files/embedsleuth-0.1.0-py3-none-any.whl
          curl --fail --location --silent --show-error "$RELEASE_URL/embedsleuth-0.1.0.tar.gz" --output release-files/embedsleuth-0.1.0.tar.gz
          curl --fail --location --silent --show-error "$RELEASE_URL/constraints-runtime.txt" --output release-files/constraints-runtime.txt
      - name: Verify bytes and package identity before selecting upload files
        run: python -I scripts/verify_pypi_artifacts.py --directory release-files --manifest release-manifests/v0.1.0.json --output dist
      - name: Install and check the exact release wheel
        run: |
          python -I -m pip install -c release-files/constraints-runtime.txt dist/embedsleuth-0.1.0-py3-none-any.whl
          python -I -m pip check
          python -I scripts/check_release_install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-v0.1.0
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    if: success() && inputs.publish && github.repository == 'aldfula/EmbedSleuth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/embedsleuth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-v0.1.0
          path: dist/
      - name: Publish with short-lived PyPI credentials and provenance
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
